<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS-573 · Inner product as similarity</title>
<style>
  :root{--ink:#14213d;--muted:#5b6478;--paper:#fbfbf8;--panel:#fff;--rule:#d9dce3;
        --A:#c8553d;--B:#2f5d8a;--C:#0b8a7a;--you:#f2a20c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.45 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
  main{max-width:1280px;margin:0 auto;padding:20px 24px 28px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px;margin-bottom:14px}
  h1{font-size:30px;line-height:1.1;margin:0;font-weight:650;letter-spacing:-.01em}
  .formula{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:22px}
  .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  figure{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:10px}
  figcaption{font-size:15px;color:var(--muted);padding:2px 4px 6px}
  .cw{position:relative;width:100%;aspect-ratio:1/1;max-height:calc(100vh - 150px);margin:0 auto}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  .box{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 18px;margin-bottom:14px}
  h2{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 8px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th{font-size:14px;font-weight:500;color:var(--muted);text-align:left;padding:2px 8px 6px}
  td{padding:4px 8px;font-size:18px;vertical-align:middle}
  .who{font-weight:650;white-space:nowrap}
  .rate{display:grid;grid-template-columns:1fr 30px;gap:8px;align-items:center}
  .rate output{text-align:right;font-size:19px}
  input[type=range]{width:100%;height:24px}
  tr.A input{accent-color:var(--A)} tr.B input{accent-color:var(--B)} tr.C input{accent-color:var(--C)}
  tr.A .who{color:var(--A)} tr.B .who{color:var(--B)} tr.C .who{color:var(--C)}
  #pairs td,#pairs th{text-align:right} #pairs td:first-child,#pairs th:first-child{text-align:left}
  #pairs tr.p{cursor:pointer;border-top:1px solid var(--rule)}
  #pairs tr.p:hover{background:#f3f4f8}
  #pairs tr.sel{background:#fff6e0}
  #pairs td{font-size:20px}
  .tag{font-size:13px;font-weight:600;padding:1px 8px;border-radius:10px;margin-left:8px;color:#fff;vertical-align:middle}
  .tag.hi{background:var(--C)} .tag.lo{background:var(--muted)}
  .row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
  .row label{font-size:16px;display:flex;gap:6px;align-items:center;cursor:pointer}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--ink)}
  button{font:inherit;font-size:16px;padding:6px 14px;border-radius:5px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover{background:#eef0f5}
  button:focus-visible,input:focus-visible{outline:3px solid var(--you);outline-offset:2px}
  .calc{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:21px;margin-top:10px;overflow-x:auto;white-space:nowrap}
  .ph{display:flex;justify-content:space-between;align-items:center;gap:12px}
  button.tg{font-size:14px;padding:3px 12px;min-width:64px}
  .hiddenp{display:none}
  .note{font-size:15px;color:var(--muted);margin-top:8px;min-height:1.4em}
</style>
</head>
<body>
<main>
  <header>
    <h1>Who has similar taste?</h1>
    <div class="formula"><i>a</i>ᵀ<i>b</i> = Σ <i>aᵢbᵢ</i> = ‖<i>a</i>‖ ‖<i>b</i>‖ cos <i>θ</i></div>
  </header>

  <div class="grid">

    <div>
      <div class="box">
        <h2 class="ph"><span>Ratings (0 to 10)</span><button class="tg" data-t="pb_rate">Hide</button></h2>
        <div id="pb_rate"><table id="ratings"></table>
        <div class="row" style="margin-top:10px">
          <button id="reset">Reset</button>
        </div></div>
      </div>

      <div class="box">
        <h2 class="ph"><span>Every pair. Click a row to see the computation.</span><button class="tg" data-t="pb_pairs">Hide</button></h2>
        <div id="pb_pairs"><table id="pairs"></table>
        <div class="calc" id="calc"></div>
        <div class="note" id="note"></div></div>
      </div>
    </div>
    <figure>
      <figcaption class="ph"><span>Each person is a vector of three ratings. Drag to rotate.</span><button class="tg" data-t="pb_fig">Hide</button></figcaption>
      <div id="pb_fig"><div class="cw"><canvas id="cv"></canvas></div></div>
    </figure>
  </div>
</main>

<script>
(() => {
  const $=id=>document.getElementById(id);
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C={ink:css('--ink'),muted:css('--muted'),rule:css('--rule'),A:css('--A'),B:css('--B'),C:css('--C')};
  const MOV=['Star Wars','La La Land','The Shining'], WHO=[['A','Alice'],['B','Bob'],['C','Charlie']];
  const INIT={A:[9,8,7],B:[8,7,6],C:[5,9,8]}, PAIRS=[['A','B'],['A','C'],['B','C']];
  let Rt=JSON.parse(JSON.stringify(INIT)), sel=0, az=-1.05, el=0.42;
  const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0), nrm=a=>Math.sqrt(dot(a,a));
  const f=(v,d=2)=>(Math.abs(v)<5e-4?0:v).toFixed(d), name=k=>WHO.find(w=>w[0]===k)[1];

  // ratings table
  $('ratings').innerHTML='<tr><th></th>'+MOV.map(m=>`<th>${m}</th>`).join('')+'</tr>'+
    WHO.map(([k,n])=>`<tr class="${k}"><td class="who">${n}</td>`+MOV.map((_,j)=>
      `<td><div class="rate"><input type="range" min="0" max="10" step="1" id="r_${k}${j}" aria-label="${n}, ${MOV[j]}"><output id="o_${k}${j}"></output></div></td>`).join('')+'</tr>').join('');
  WHO.forEach(([k])=>MOV.forEach((_,j)=>$(`r_${k}${j}`).addEventListener('input',e=>{Rt[k][j]=+e.target.value; update();})));

  function vectors(){ const V={};
    for(const [k] of WHO){ let v=Rt[k].slice();
      if(false){ const m=(v[0]+v[1]+v[2])/3; v=v.map(x=>x-m); }
      if(false){ const n=nrm(v); if(n>1e-9) v=v.map(x=>x/n); }
      V[k]=v; } return V; }

  function update(){
    WHO.forEach(([k])=>MOV.forEach((_,j)=>{ $(`r_${k}${j}`).value=Rt[k][j]; $(`o_${k}${j}`).textContent=Rt[k][j]; }));
    const V=vectors(), rows=PAIRS.map(([a,b])=>{ const d=dot(V[a],V[b]), na=nrm(V[a]), nb=nrm(V[b]), c=(na>1e-9&&nb>1e-9)?d/(na*nb):NaN;
      return {a,b,d,c,ang:isNaN(c)?NaN:Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI}; });
    const valid=rows.filter(r=>!isNaN(r.c)), hi=valid.length?valid.reduce((p,q)=>q.c>p.c?q:p):null, lo=valid.length?valid.reduce((p,q)=>q.c<p.c?q:p):null;
    const hiD=rows.reduce((p,q)=>q.d>p.d?q:p);
    $('pairs').innerHTML='<tr><th>pair</th><th>inner product</th><th>cosine similarity</th><th>angle</th></tr>'+rows.map((r,i)=>
      `<tr class="p${i===sel?' sel':''}" data-i="${i}"><td>${name(r.a)} &amp; ${name(r.b)}${r===hi?'<span class="tag hi">most similar</span>':r===lo&&hi!==lo?'<span class="tag lo">least similar</span>':''}</td>`+
      `<td>${f(r.d,false?3:1)}</td><td>${isNaN(r.c)?'–':f(r.c,4)}</td><td>${isNaN(r.ang)?'–':f(r.ang,1)+'°'}</td></tr>`).join('');
    document.querySelectorAll('#pairs tr.p').forEach(tr=>tr.onclick=()=>{sel=+tr.dataset.i; update();});
    const r=rows[sel], a=V[r.a], b=V[r.b], d=false||false?2:0, par=x=>x<0?`(${f(x,d)})`:f(x,d);
    $('calc').innerHTML=`<i>a</i>ᵀ<i>b</i> = ${a.map((x,i)=>par(x)+'·'+par(b[i])).join(' + ')} = <b>${f(r.d,false?3:1)}</b>`+
      (isNaN(r.c)?'':` &nbsp;&nbsp; cos <i>θ</i> = ${f(r.d,2)} / (${f(nrm(a),2)} · ${f(nrm(b),2)}) = <b>${f(r.c,4)}</b>`);
    const norm=false, cent=false;
    $('note').textContent = !valid.length ? 'A zero vector has no direction, so the angle is undefined.'
      : cent ? 'After removing each person\'s average, the vector keeps only what they like more or less than usual. Differences in taste now show up clearly.'
      : norm ? 'With unit-length vectors the inner product is the cosine of the angle. All ratings are positive, so every pair still looks similar.'
      : (hi && hiD!==hi) ? `The largest raw inner product is ${name(hiD.a)} & ${name(hiD.b)}, but the most similar direction is ${name(hi.a)} & ${name(hi.b)}. Generous raters get large inner products with everyone.`
      : 'The raw inner product mixes two things: how similar the directions are, and how large the ratings are.';
    draw(V);
  }

  // 3D view
  function draw(V){
    const cv=$('cv'), rc=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
    cv.width=Math.round(rc.width*dpr); cv.height=Math.round(rc.height*dpr);
    const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); const w=rc.width,h=rc.height; g.clearRect(0,0,w,h);
    const norm=false, cent=false, hiR=norm?1:(cent?5:10), loR=cent?-hiR:0;
    const U=v=>v.map(x=>(x-loR)/(hiR-loR)-.5);
    const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el), s=Math.min(w,h)*0.52, cx=w/2, cy=h/2+10;
    const P=v=>{ const u=U(v), xr=u[0]*ca-u[1]*sa, yr=u[0]*sa+u[1]*ca; return [cx+s*xr, cy-s*(yr*se+u[2]*ce)]; };
    const seg=(a,b)=>{const p=P(a),q=P(b); g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(q[0],q[1]); g.stroke();};
    // box
    g.strokeStyle='#e3e5ea'; g.lineWidth=1; const L=loR,H=hiR;
    [[[L,L,L],[H,L,L]],[[L,L,L],[L,H,L]],[[H,L,L],[H,H,L]],[[L,H,L],[H,H,L]],[[L,L,H],[H,L,H]],[[L,L,H],[L,H,H]],[[H,L,H],[H,H,H]],[[L,H,H],[H,H,H]],
     [[L,L,L],[L,L,H]],[[H,L,L],[H,L,H]],[[L,H,L],[L,H,H]],[[H,H,L],[H,H,H]]].forEach(e=>seg(e[0],e[1]));
    // floor grid
    for(let k=1;k<5;k++){ const t=L+(H-L)*k/5; seg([t,L,L],[t,H,L]); seg([L,t,L],[H,t,L]); }
    // axes through the origin
    g.strokeStyle=C.ink; g.lineWidth=1.5; seg([L,0,0],[H,0,0]); seg([0,L,0],[0,H,0]); seg([0,0,L],[0,0,H]);
    g.fillStyle=C.ink; g.font='15px "Segoe UI",system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    const lab=(v,t)=>{const p=P(v),o=P([0,0,0]),dx=p[0]-o[0],dy=p[1]-o[1],n=Math.hypot(dx,dy)||1,q=[p[0]+dx/n*16,p[1]+dy/n*16],m=g.measureText(t).width; g.textAlign=dx/n>0.5?'left':dx/n<-0.5?'right':'center'; const x0=g.textAlign==='left'?q[0]:g.textAlign==='right'?q[0]-m:q[0]-m/2; g.fillStyle='rgba(255,255,255,.85)'; g.fillRect(x0-3,q[1]-11,m+6,22); g.fillStyle=C.ink; g.fillText(t,q[0],q[1]);};
    lab([H,0,0],MOV[0]); lab([0,H,0],MOV[1]); lab([0,0,H],MOV[2]);
    // vectors, far to near
    const order=WHO.map(([k,n])=>{ const u=U(V[k]); return {k,n,depth:(u[0]*sa+u[1]*ca)*ce-u[2]*se}; }).sort((p,q)=>q.depth-p.depth);
    const placed=[];
    for(const {k,n} of order){ const v=V[k], O=P([0,0,0]), T=P(v), F=P([v[0],v[1],L]), col=C[k];
      g.strokeStyle=col; g.globalAlpha=.45; g.lineWidth=1.5; g.setLineDash([4,4]); g.beginPath(); g.moveTo(T[0],T[1]); g.lineTo(F[0],F[1]); g.stroke(); g.setLineDash([]);
      g.beginPath(); g.arc(F[0],F[1],3,0,7); g.fillStyle=col; g.fill(); g.globalAlpha=1;
      const ang=Math.atan2(T[1]-O[1],T[0]-O[0]), len=Math.hypot(T[0]-O[0],T[1]-O[1]);
      if(len>3){ g.lineWidth=4.5; g.beginPath(); g.moveTo(O[0],O[1]); g.lineTo(T[0]-10*Math.cos(ang),T[1]-10*Math.sin(ang)); g.stroke();
        g.beginPath(); g.moveTo(T[0],T[1]); g.lineTo(T[0]-16*Math.cos(ang-.38),T[1]-16*Math.sin(ang-.38)); g.lineTo(T[0]-16*Math.cos(ang+.38),T[1]-16*Math.sin(ang+.38)); g.closePath(); g.fill(); }
      g.font='600 17px "Segoe UI",system-ui,sans-serif'; g.textAlign='left'; g.textBaseline='bottom';
      const m=g.measureText(n).width; let ly=T[1]-6; while(placed.some(q=>Math.abs(q[0]-T[0])<70&&Math.abs(q[1]-ly)<20)) ly+=22; placed.push([T[0],ly]); g.fillStyle='rgba(255,255,255,.85)'; g.fillRect(T[0]+8,ly-20,m+6,22); g.fillStyle=col; g.fillText(n,T[0]+11,ly); }
  }

  const cv=$('cv'); let last=null;
  cv.addEventListener('pointerdown',e=>{last=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing';});
  cv.addEventListener('pointermove',e=>{ if(!last) return; az-=(e.clientX-last[0])*0.01; el=Math.min(1.5,Math.max(0.05,el+(e.clientY-last[1])*0.01)); last=[e.clientX,e.clientY]; draw(vectors()); });
  const end=()=>{last=null; cv.style.cursor='grab';}; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  $('reset').onclick=()=>{ Rt=JSON.parse(JSON.stringify(INIT)); sel=0; update(); };
  document.querySelectorAll('button.tg').forEach(b=>b.onclick=()=>{ const el=$(b.dataset.t), h=el.classList.toggle('hiddenp'); b.textContent=h?'Show':'Hide'; if(!h) draw(vectors()); });
  window.addEventListener('resize',()=>draw(vectors()));
  update();
})();
</script>
</body>
</html>
