<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Low-rank approximation of an image</title>
<style>
  :root{--bg:#fbfbf9;--ink:#1d1f24;--muted:#6b6f78;--line:#dcdcd6;--blue:#3b7dd8;--orange:#e8801a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  header{padding:18px 24px 6px}
  header h1{margin:0;font-size:22px;font-weight:600}
  main{display:grid;grid-template-columns:1fr 340px;gap:18px;padding:12px 24px 24px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .stage{min-height:520px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start}
  @media (max-width:700px){.stage{grid-template-columns:1fr}}
  .panel h3{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--muted)}
  .panel canvas{width:100%;display:block;border:1px solid var(--line)}
  .side{display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .card h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
  select{width:100%;font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:#fff}
  input[type=file]{width:100%;font:inherit;font-size:13px;margin-top:8px}
  .slider{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:8px}
  .slider output{font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
  input[type=range]{width:100%;accent-color:var(--orange)}
  #bars{width:100%;height:170px;display:block}
  .ro{font-variant-numeric:tabular-nums;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
  .ro span:nth-child(odd){color:var(--muted)}
</style>
</head>
<body>
<header><h1>Low-rank approximation of an image</h1></header>
<main>
  <section class="stage">
    <div class="panel"><h3>A</h3><canvas id="cA" width="512" height="512"></canvas></div>
    <div class="panel"><h3 id="hK">A<sub>k</sub></h3><canvas id="cK" width="512" height="512"></canvas></div>
  </section>
  <aside class="side">
    <div class="card">
      <h2>Singular values</h2>
      <canvas id="bars"></canvas>
      <div class="slider"><label for="k">k</label><input type="range" id="k" min="1" max="512" step="1" value="10"><output id="kOut">10</output></div>
    </div>
    <div class="card">
      <h2>Image</h2>
      <select id="preset"></select>
      <input type="file" id="file" accept="image/*">
    </div>
    <div class="card">
      <h2>Compression</h2>
      <canvas id="store" style="width:100%;height:64px;display:block"></canvas>
      <div class="ro" id="comp" style="margin-top:6px"></div>
    </div>
  </aside>
</main>

// ---------- SVD via the symmetric eigen-decomposition of AᵀA (Householder tridiagonalisation + implicit QL) ----------
// Symmetric eigen-decomposition (JAMA tred2 + tql2). S: Float64Array n×n row-major. Returns {d: eigenvalues asc, V: eigenvectors (columns) n×n row-major}
function symeig(S,n){
  const V=new Float64Array(S), d=new Float64Array(n), e=new Float64Array(n);

  for(let j=0;j<n;j++)d[j]=V[(n-1)*n+j];

    let scale=0,h=0;

    else{

function svdSym(A,N){

function loadImage(src,cb){
  const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=N;c.height=N;const g=c.getContext('2d');
    const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2;

    const d=g.getImageData(0,0,N,N).data,M=new Float64Array(N*N);

  for(let e=Math.ceil(lo);e<=Math.floor(hi);e++){const y=ys(Math.pow(10,e));g.fillText('10'+String(e).replace(/-/,'⁻').replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]),L-5,y);g.strokeStyle='#eeeeea';g.beginPath();g.moveTo(L,y+.5);g.lineTo(L+w,y+.5);g.stroke();}
  const bw=w/N;
  for(let j=0;j<N;j++){const y=ys(s[j]);g.fillStyle=j<k?'#3b7dd8':'#c9cbc8';g.fillRect(L+j*bw,y,Math.max(1,bw-0.6),T+h-y);}
  g.fillStyle='#1d1f24';g.textAlign='center';g.textBaseline='top';
  for(const j of [1,128,256,384,512])g.fillText(j,L+(j-0.5)*bw,T+h+6);
  const xc=L+k*bw;
  g.strokeStyle='#e8801a';g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();g.moveTo(xc,T-4);g.lineTo(xc,T+h+2);g.stroke();g.setLineDash([]);
}
function drawStore(stored,total){
  const c=document.getElementById('store'),[g,W,H]=fit(c);
  g.clearRect(0,0,W,H);
  const L=62,R=8,w=W-L-R,bh=18,frac=Math.min(1,stored/total);
  g.font='12px "Segoe UI",Roboto,Arial';g.textBaseline='middle';g.textAlign='right';g.fillStyle='#6b6f78';
  g.fillText('original',L-8,12);g.fillText('rank k',L-8,42);
  g.fillStyle='#c9cbc8';g.fillRect(L,3,w,bh);
  g.fillStyle=stored>total?'#d23c3c':'#3b7dd8';g.fillRect(L,33,w*frac,bh);
  g.strokeStyle='#dcdcd6';g.strokeRect(L+.5,3.5,w-1,bh-1);g.strokeRect(L+.5,33.5,w-1,bh-1);
}
function update(){
  if(!S)return;
  kOut.value=k;
  const Ak=truncate(S,k);
  drawImg('cA',A);drawImg('cK',Ak);
  document.getElementById('hK').innerHTML='A<sub>k</sub>, k = '+k;
  drawBars();
  const err=new Float64Array(N*N);for(let i=0;i<err.length;i++)err[i]=A[i]-Ak[i];
  const rel=fro(err)/fro(A), stored=k*(2*N+1), total=N*N;
  const mse=fro(err)*fro(err)/(N*N), psnr=mse>0?10*Math.log10(1/mse):Infinity;
  document.getElementById('comp').innerHTML=
    `<span>original</span><span>${N} × ${N} = ${total.toLocaleString()} numbers</span>`+
    `<span>rank k</span><span>k (${N} + ${N} + 1) = ${stored.toLocaleString()} numbers</span>`+
    `<span>compression</span><span>${(total/stored).toFixed(1)} ×</span>`+
    `<span>PSNR</span><span>${isFinite(psnr)?psnr.toFixed(1)+' dB':'∞'}</span>`;
  drawStore(stored,total);
}
window.addEventListener('resize',()=>{if(S)drawBars();});
loadImage('data:image/png;base64,'+IMAGES[sel.value],setMatrix);
</script>
