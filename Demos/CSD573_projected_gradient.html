<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projected gradient descent</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfbf9;color:#1d1f24;font:16px/1.35 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{padding:12px 20px 4px}
h1{margin:0;font-size:22px;font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:8px 20px 12px}
.card{background:#fff;border:1px solid #dcdcd6;border-radius:6px;padding:10px 12px}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:calc(100vh - 258px);min-height:380px}
@media(max-width:900px){.stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:auto;min-height:900px;max-height:none}}
.stage .card{position:relative;padding:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
aside{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
@media(max-width:900px){aside{grid-template-columns:1fr}}
h2{margin:0 0 7px;font-size:13px;font-weight:600;color:#6b6f78}
.row{display:flex;gap:6px}
button{flex:1;font:inherit;font-size:14px;padding:6px 4px;border:1px solid #c9c9c2;border-radius:5px;background:#fff;color:#1d1f24;cursor:pointer}
button.on{background:#1d1f24;border-color:#1d1f24;color:#fff}
label{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-size:14px;margin-top:8px}
label.off{opacity:.38}
input[type=range]{width:100%;margin:0}
output{font-variant-numeric:tabular-nums;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:1.5px 0}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>

function bestB(a,c,b){for(let it=0;it<40;it++){let g=0,h=0;for(let i=0;i<M;i++){const p=sig(a*XTR[i][0]+c*XTR[i][1]+b);g+=p-YTR[i];h+=p*(1-p)}const d=Math.max(-2,Math.min(2,g/Math.max(h,1e-9)));b-=d;if(Math.abs(d)<1e-9)break}return b}
function projL2(v,t){const n=Math.hypot(v[0],v[1]);return n<=t?[v[0],v[1]]:[v[0]*t/n,v[1]*t/n]}
function projL1(v,t){const a=Math.abs(v[0]),c=Math.abs(v[1]);if(a+c<=t)return[v[0],v[1]];const hi=Math.max(a,c),lo=Math.min(a,c);let th=(hi+lo-t)/2;if(lo-th<=0)th=hi-t;return[Math.sign(v[0])*Math.max(a-th,0),Math.sign(v[1])*Math.max(c-th,0)]}
function proj(v,t){return setC===1?projL1(v,t):setC===2?projL2(v,t):[v[0],v[1]]}
function objective(th,b){return ce(th[0],th[1],b)}
function accuracy(X,Y,th,b){let c=0;for(let i=0;i<X.length;i++)if((th[0]*X[i][0]+th[1]*X[i][1]+b>0?1:0)===Y[i])c++;return c/X.length}
// Lipschitz constant of the gradient of the mean cross-entropy: lambda_max([X 1]^T [X 1]) / (4m)
function lipschitz(){let v=[1,1,1],n=0;for(let it=0;it<200;it++){const w=[0,0,0];for(let i=0;i<M;i++){const s=XTR[i][0]*v[0]+XTR[i][1]*v[1]+v[2];w[0]+=s*XTR[i][0];w[1]+=s*XTR[i][1];w[2]+=s}n=Math.hypot(w[0],w[1],w[2]);v=w.map(q=>q/n)}return n/(4*M)}
// theta(k+1) = P_C(theta(k) - t g(k)), fixed t; the intercept b is neither constrained nor penalised
function run(tau,t){const path=[];let th=[start[0],start[1]],b=bestB(th[0],th[1],0),u=null;
  for(let k=0;k<=K;k++){path.push({th,b,u,F:objective(th,b)});if(k===K)break;
    const g=grad(th[0],th[1],b);u=[th[0]-t*g[0],th[1]-t*g[1]];
    th=proj(u,tau);b-=t*g[2]}
  return path}
// minimiser of the current problem: accelerated projected gradient
function reference(tau){const t=1/LIP;let x=[0,0],xo=[0,0],b=0,bo=0;
  for(let k=1;k<=3000;k++){const m=(k-1)/(k+2),v=[x[0]+m*(x[0]-xo[0]),x[1]+m*(x[1]-xo[1])],vb=b+m*(b-bo),g=grad(v[0],v[1],vb);
    const u=[v[0]-t*g[0],v[1]-t*g[1]];xo=x;bo=b;x=proj(u,tau);b=vb-t*g[2]}
  return[x[0],x[1],b]}

// ---------- loss surface over (theta1, theta2), intercept minimised out ----------
const VP={x0:-1.3,x1:4.9,y0:-2.3,y1:2.7},GX=94,GY=76;
function surface(){const s=new Float64Array(GX*GY);for(let j=0;j<GY;j++){let b=-0.6;for(let i=0;i<GX;i++){const a=VP.x0+(VP.x1-VP.x0)*i/(GX-1),c=VP.y0+(VP.y1-VP.y0)*j/(GY-1);b=bestB(a,c,b);s[j*GX+i]=ce(a,c,b)}}let mn=Infinity;for(const v of s)if(v<mn)mn=v;return{f:s,mn}}
// training set: m samples from the pool (fixed seeded shuffle, both classes present); the labels of nflip of them are flipped
function mulberry(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sample(n,seed,nflip=0){let a=Math.imul(seed,2654435761)>>>0;const rnd=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const idx=POOLX.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  const pick=idx.slice(0,n);if(!pick.some(i=>POOLY[i]===1))pick[0]=idx.find(i=>POOLY[i]===1);if(!pick.some(i=>POOLY[i]===0))pick[0]=idx.find(i=>POOLY[i]===0);
  XTR=pick.map(i=>POOLX[i]);YTR=pick.map(i=>POOLY[i]);M=n;LIP=lipschitz();
  const r2=mulberry(Math.imul(3,40503)>>>0),ord=YTR.map((_,i)=>i);for(let i=ord.length-1;i>0;i--){const j=Math.floor(r2()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}
  FLIP=YTR.map(()=>false);for(let q=0;q<nflip;q++){YTR[ord[q]]=1-YTR[ord[q]];FLIP[ord[q]]=true}}

// ---------- state ----------
let path=[],opt=[0,0,0],fld=null,refKey='',dataKey='';
function recompute(){const n=+$('ns').value,fl=$('flip');fl.max=Math.floor(n/3);const nf=Math.min(+fl.value,+fl.max),dk=n+'|'+nf;
  if(dk!==dataKey){sample(n,17,nf);fld=surface();dataKey=dk;refKey=''}
  const tau=+$('tau').value,t=+$('step').value/LIP;
  const key=[setC,setC?tau:0].join('|');if(key!==refKey){opt=reference(tau);refKey=key}
  path=run(tau,t);draw()}

// ---------- drawing ----------
const GREEN='#2a9d5c',INK='#1d1f24',MUTE='#6b6f78',BLUE='#3b7dd8',ORANGE='#e8801a',GRID='#e7e7e1',CB='#1f5fbf',CR='#d23c3c',FONT='"Segoe UI",Roboto,Arial,sans-serif';
function setup(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);return{g,w:r.width,h:r.height}}
function frame(g,w,h,v,xl,yl,free,T=34){const L=46,R=14,B=42,s=Math.min((w-L-R)/(v.x1-v.x0),(h-T-B)/(v.y1-v.y0)),sx=free?(w-L-R)/(v.x1-v.x0):s,sy=free?(h-T-B)/(v.y1-v.y0):s,pw=sx*(v.x1-v.x0),ph=sy*(v.y1-v.y0),ox=L+(w-L-R-pw)/2,oy=T+(h-T-B-ph)/2;
  const X=x=>ox+(x-v.x0)*sx,Y=y=>oy+ph-(y-v.y0)*sy;
  g.font='13px '+FONT;g.lineWidth=1;g.fillStyle=MUTE;
  g.textAlign='center';g.textBaseline='top';for(let x=Math.ceil(v.x0);x<=v.x1;x++){g.strokeStyle=GRID;g.beginPath();g.moveTo(X(x),oy);g.lineTo(X(x),oy+ph);g.stroke();g.fillText(x,X(x),oy+ph+6)}
  g.fillText(xl,ox+pw/2,oy+ph+22);
  g.textAlign='right';g.textBaseline='middle';for(let y=Math.ceil(v.y0);y<=v.y1;y++){g.strokeStyle=GRID;g.beginPath();g.moveTo(ox,Y(y));g.lineTo(ox+pw,Y(y));g.stroke();g.fillText(y,ox-7,Y(y))}
  g.save();g.translate(ox-30,oy+ph/2);g.rotate(-Math.PI/2);g.textAlign='center';g.textBaseline='middle';g.fillText(yl,0,0);g.restore();
  return{X,Y,ox,oy,pw,ph,s}}
function arrow(g,p,q,col,dash,lw){const dx=q[0]-p[0],dy=q[1]-p[1],n=Math.hypot(dx,dy);if(n<0.5)return;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.setLineDash(dash);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();g.setLineDash([]);
  if(n>9){const a=Math.atan2(dy,dx),hl=9;g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(q[0]-hl*Math.cos(a-0.42),q[1]-hl*Math.sin(a-0.42));g.lineTo(q[0]-hl*Math.cos(a+0.42),q[1]-hl*Math.sin(a+0.42));g.closePath();g.fill()}}
const DV={x0:-2.4,x1:4.3,y0:-2.5,y1:3.8};
function boundary(g,F,th,b,col,dash,lw){if(Math.hypot(th[0],th[1])<1e-9)return;const pts=[];const f=(x,y)=>th[0]*x+th[1]*y+b;
  const E=[[DV.x0,DV.y0,DV.x1,DV.y0],[DV.x1,DV.y0,DV.x1,DV.y1],[DV.x1,DV.y1,DV.x0,DV.y1],[DV.x0,DV.y1,DV.x0,DV.y0]];
  for(const e of E){const a=f(e[0],e[1]),c=f(e[2],e[3]);if((a<0)!==(c<0)){const t=a/(a-c);pts.push([e[0]+t*(e[2]-e[0]),e[1]+t*(e[3]-e[1])])}}
  if(pts.length<2)return;g.strokeStyle=col;g.lineWidth=lw;g.setLineDash(dash);g.beginPath();g.moveTo(F.X(pts[0][0]),F.Y(pts[0][1]));g.lineTo(F.X(pts[1][0]),F.Y(pts[1][1]));g.stroke();g.setLineDash([])}
function mark(g,x,y,cls,r){if(cls){g.beginPath();g.moveTo(x,y-r*1.25);g.lineTo(x+r*1.15,y+r*0.85);g.lineTo(x-r*1.15,y+r*0.85);g.closePath()}else{g.beginPath();g.arc(x,y,r,0,2*Math.PI)}}
function drawData(k){const{g,w,h}=setup($('cData')),F=frame(g,w,h,DV,'mean radius (standardized)','mean texture (standardized)',true,60),p=path[k];
  g.save();g.beginPath();g.rect(F.ox,F.oy,F.pw,F.ph);g.clip();
  for(let i=0;i<XTE.length;i++){g.globalAlpha=0.22;g.fillStyle=YTE[i]?CR:CB;mark(g,F.X(XTE[i][0]),F.Y(XTE[i][1]),YTE[i],3);g.fill()}g.globalAlpha=1;
  const big=M<=60;
  for(let i=0;i<M;i++){const x=F.X(XTR[i][0]),y=F.Y(XTR[i][1]),c=YTR[i];g.globalAlpha=big?1:0.75;g.fillStyle=c?CR:CB;mark(g,x,y,c,big?5.5:3.4);g.fill();if(big){g.strokeStyle='#fff';g.lineWidth=1;g.stroke()}g.globalAlpha=1;
    if(FLIP[i]){const r=big?9:6;g.strokeStyle=INK;g.lineWidth=1.6;g.strokeRect(x-r,y-r,2*r,2*r)}
    const z=p.th[0]*XTR[i][0]+p.th[1]*XTR[i][1]+p.b;if((z>0?1:0)!==c){g.strokeStyle='rgba(29,31,36,.8)';g.lineWidth=1.2;g.beginPath();g.arc(x,y,big?9.5:6.5,0,2*Math.PI);g.stroke()}}
  if(k>0&&p.u&&Math.hypot(p.u[0]-p.th[0],p.u[1]-p.th[1])>1e-9)boundary(g,F,p.u,p.b,BLUE,[6,4],2);
  boundary(g,F,opt,opt[2],GREEN,[],4.5);
  boundary(g,F,p.th,p.b,INK,[],2.5);g.restore();
  {const sg=v=>(v<0?' \u2212 ':' + ')+Math.abs(v).toFixed(3),eq='p(malignant) = \u03c3( '+(p.th[0]<0?'\u2212':'')+Math.abs(p.th[0]).toFixed(3)+'\u00b7radius'+sg(p.th[1])+'\u00b7texture'+sg(p.b)+' )';
   g.font='15px '+FONT;g.fillStyle=INK;g.textAlign='left';g.textBaseline='middle';g.fillText(eq,F.ox,43)}
  g.strokeStyle=INK;g.lineWidth=1;g.strokeRect(F.ox,F.oy,F.pw,F.ph);
  g.font='13px '+FONT;g.textBaseline='middle';g.textAlign='left';let x=F.ox,y=18;
  g.fillStyle=CB;mark(g,x+5,y,0,4);g.fill();g.fillStyle=INK;g.fillText('benign',x+14,y);x+=14+g.measureText('benign').width+14;
  g.fillStyle=CR;mark(g,x+5,y,1,4);g.fill();g.fillStyle=INK;g.fillText('malignant',x+14,y);x+=14+g.measureText('malignant').width+16;
  g.strokeStyle=INK;g.lineWidth=1.3;g.beginPath();g.arc(x+6,y,6,0,2*Math.PI);g.stroke();g.fillText('misclassified',x+17,y);x+=17+g.measureText('misclassified').width+14;
  g.globalAlpha=0.3;g.fillStyle=CB;mark(g,x+4,y,0,3.5);g.fill();g.fillStyle=CR;mark(g,x+14,y,1,3.5);g.fill();g.globalAlpha=1;g.fillStyle=INK;g.fillText('test',x+23,y);x+=23+g.measureText('test').width+14;
  g.strokeStyle=INK;g.lineWidth=1.6;g.strokeRect(x,y-6,12,12);g.fillText('mislabeled',x+18,y);x+=18+g.measureText('mislabeled').width+14;
  g.strokeStyle=GREEN;g.lineWidth=4.5;g.beginPath();g.moveTo(x,y);g.lineTo(x+24,y);g.stroke();g.fillText('optimal',x+30,y)}
function contours(g,F,lev){const{f}=fld,dx=(VP.x1-VP.x0)/(GX-1),dy=(VP.y1-VP.y0)/(GY-1);g.beginPath();
  for(let j=0;j<GY-1;j++)for(let i=0;i<GX-1;i++){const a=f[j*GX+i],b=f[j*GX+i+1],c=f[(j+1)*GX+i+1],d=f[(j+1)*GX+i];
    const x=VP.x0+i*dx,y=VP.y0+j*dy,pts=[];
    if((a<lev)!==(b<lev))pts.push([x+dx*(lev-a)/(b-a),y]);if((b<lev)!==(c<lev))pts.push([x+dx,y+dy*(lev-b)/(c-b)]);
    if((d<lev)!==(c<lev))pts.push([x+dx*(lev-d)/(c-d),y+dy]);if((a<lev)!==(d<lev))pts.push([x,y+dy*(lev-a)/(d-a)]);
    for(let q=0;q+1<pts.length;q+=2){g.moveTo(F.X(pts[q][0]),F.Y(pts[q][1]));g.lineTo(F.X(pts[q+1][0]),F.Y(pts[q+1][1]))}}
  g.stroke()}
let PF=null;
function drawPar(k){const{g,w,h}=setup($('cPar')),F=frame(g,w,h,VP,'θ₁','θ₂',false,60),tau=+$('tau').value;PF=F;
  g.font='15px '+FONT;g.fillStyle=INK;g.textAlign='left';g.textBaseline='middle';g.fillText('F(θ, b) = −(1/m) Σᵢ [ yᵢ log pᵢ + (1 − yᵢ) log(1 − pᵢ) ]',F.ox,43);
  const P=v=>[F.X(v[0]),F.Y(v[1])];
  g.save();g.beginPath();g.rect(F.ox,F.oy,F.pw,F.ph);g.clip();
  g.strokeStyle='#c3c5cb';g.lineWidth=1;for(const d of[0.004,0.015,0.04,0.08,0.14,0.22,0.32,0.45,0.62,0.85,1.15,1.5,2,2.6,3.4])contours(g,F,fld.mn+d);
  g.strokeStyle='#8b8e96';g.lineWidth=1;g.beginPath();g.moveTo(F.X(0),F.oy);g.lineTo(F.X(0),F.oy+F.ph);g.moveTo(F.ox,F.Y(0));g.lineTo(F.ox+F.pw,F.Y(0));g.stroke();
  if(setC){g.beginPath();if(setC===2)g.arc(F.X(0),F.Y(0),tau*F.s,0,2*Math.PI);else{g.moveTo(F.X(tau),F.Y(0));g.lineTo(F.X(0),F.Y(tau));g.lineTo(F.X(-tau),F.Y(0));g.lineTo(F.X(0),F.Y(-tau));g.closePath()}
    g.fillStyle='rgba(59,125,216,.14)';g.fill();g.strokeStyle=INK;g.lineWidth=1.6;g.stroke()}
  // minimiser of the current problem
  {const[x,y]=P(opt);g.beginPath();for(let i=0;i<10;i++){const r=i%2?4.2:10,a=-Math.PI/2+i*Math.PI/5;g.lineTo(x+r*Math.cos(a),y+r*Math.sin(a))}g.closePath();g.fillStyle='#fff';g.fill();g.strokeStyle=INK;g.lineWidth=1.3;g.stroke()}
  for(let j=1;j<=k;j++){const a=P(path[j-1].th),u=P(path[j].u),b=P(path[j].th),cur=j===k;
    if(cur){arrow(g,a,u,BLUE,[6,4],2.4);arrow(g,u,b,ORANGE,[],2.4);if(Math.hypot(u[0]-b[0],u[1]-b[1])>1){g.fillStyle='#fff';g.strokeStyle=BLUE;g.lineWidth=2;g.beginPath();g.arc(u[0],u[1],4.5,0,2*Math.PI);g.fill();g.stroke()}}
    else{g.globalAlpha=0.55;g.lineWidth=1.1;g.strokeStyle=BLUE;g.setLineDash([4,3]);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(u[0],u[1]);g.stroke();g.setLineDash([]);g.strokeStyle=ORANGE;g.beginPath();g.moveTo(u[0],u[1]);g.lineTo(b[0],b[1]);g.stroke();g.globalAlpha=1}}
  for(let j=0;j<k;j++){const a=P(path[j].th);g.fillStyle=INK;g.globalAlpha=j===0?1:0.55;g.beginPath();g.arc(a[0],a[1],j===0?4.5:3,0,2*Math.PI);g.fill();g.globalAlpha=1}
  {const a=P(path[0].th);g.strokeStyle=INK;g.lineWidth=1.3;g.beginPath();g.arc(a[0],a[1],9,0,2*Math.PI);g.stroke()}
  {const a=P(path[k].th);g.fillStyle=ORANGE;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(a[0],a[1],6,0,2*Math.PI);g.fill();g.stroke()}
  g.restore();g.strokeStyle=INK;g.lineWidth=1;g.strokeRect(F.ox,F.oy,F.pw,F.ph);
  g.font='13px '+FONT;g.textBaseline='middle';g.textAlign='left';let x=F.ox,y=18;
  g.strokeStyle=BLUE;g.lineWidth=2.4;g.setLineDash([6,4]);g.beginPath();g.moveTo(x,y);g.lineTo(x+26,y);g.stroke();g.setLineDash([]);g.fillStyle=INK;g.fillText('gradient step',x+32,y);x+=32+g.measureText('gradient step').width+16;
  g.strokeStyle=ORANGE;g.beginPath();g.moveTo(x,y);g.lineTo(x+26,y);g.stroke();g.fillText('projection',x+32,y);x+=32+g.measureText('projection').width+16;
  g.beginPath();for(let i=0;i<10;i++){const r=i%2?3:7,a=-Math.PI/2+i*Math.PI/5;g.lineTo(x+7+r*Math.cos(a),y+r*Math.sin(a))}g.closePath();g.fillStyle='#fff';g.fill();g.strokeStyle=INK;g.lineWidth=1.2;g.stroke();g.fillStyle=INK;g.fillText('minimizer',x+19,y)}
function draw(){const k=+$('it').value,p=path[k];
  $('tauO').value=(+$('tau').value).toFixed(1);$('nsO').value=$('ns').value;$('flipO').value=$('flip').value;$('stepO').value=(+$('step').value).toFixed(2);$('itO').value=k;
  $('tauLab').className=setC?'':'off';$('tau').disabled=!setC;
  drawData(k);drawPar(k);
  $('rF').textContent=p.F.toFixed(4);$('rT1').textContent=p.th[0].toFixed(3);$('rT2').textContent=p.th[1].toFixed(3);
  $('rTr').textContent=(100*accuracy(XTR,YTR,p.th,p.b)).toFixed(1)+' %';$('rTe').textContent=(100*accuracy(XTE,YTE,p.th,p.b)).toFixed(1)+' %';$('rTo').textContent=(100*accuracy(XTE,YTE,opt,opt[2])).toFixed(1)+' %'}

// ---------- controls ----------
function group(id,set){const bs=[...$(id).querySelectorAll('button')];bs.forEach(b=>b.onclick=()=>{bs.forEach(o=>o.classList.toggle('on',o===b));set(+b.dataset.v);recompute()})}
group('setBtns',v=>setC=v);
['tau','step','ns','flip'].forEach(id=>$(id).oninput=recompute);$('it').oninput=draw;
let dragging=false;const cp=$('cPar');
const toTheta=e=>{const r=cp.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;return[VP.x0+(x-PF.ox)/PF.s,VP.y0+(PF.oy+PF.ph-y)/PF.s]};
cp.addEventListener('pointerdown',e=>{const r=cp.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-PF.X(start[0]),y-PF.Y(start[1]))<18){dragging=true;cp.setPointerCapture(e.pointerId)}});
cp.addEventListener('pointermove',e=>{if(!dragging)return;const t=toTheta(e);start=[Math.min(Math.max(t[0],VP.x0+0.1),VP.x1-0.1),Math.min(Math.max(t[1],VP.y0+0.1),VP.y1-0.1)];recompute()});
cp.addEventListener('pointerup',()=>dragging=false);cp.addEventListener('pointercancel',()=>dragging=false);
window.addEventListener('resize',draw);
recompute();
</script>
