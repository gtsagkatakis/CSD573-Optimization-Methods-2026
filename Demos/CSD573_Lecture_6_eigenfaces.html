<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS-573 · Eigenfaces</title>
<style>
  :root{--ink:#1d1f24;--muted:#6b6f78;--paper:#fbfbf9;--panel:#fff;--rule:#dcdcd6;--blue:#3b7dd8;--x:#e8801a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  main{max-width:1240px;margin:0 auto;padding:18px 22px 26px}
  h1{font-size:22px;font-weight:600;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}
  .stage{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    min-height:560px;height:calc(100vh - 90px);max-height:780px}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .legend{position:absolute;left:12px;bottom:8px;font-size:13px;color:var(--muted);pointer-events:none}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:10px 14px 12px;margin-bottom:12px}
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
  select{font:inherit;width:100%;padding:5px 6px;border:1px solid var(--rule);border-radius:5px;background:#fff}
  .slider{display:grid;grid-template-columns:1fr 40px;gap:10px;align-items:center}
  .slider output{text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .modes{display:grid;grid-template-columns:1fr;gap:0}
  .modes button{font:inherit;font-size:15px;padding:7px 4px;border:1px solid var(--ink);background:#fff;color:var(--ink);
    cursor:pointer;margin-top:-1px}
  .modes button:first-child{margin-top:0;border-radius:5px 5px 0 0}
  .modes button:last-child{border-radius:0 0 5px 5px}
  .modes button.on{background:var(--ink);color:#fff}
  table.read{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
  table.read td{padding:3px 0;vertical-align:top}
  table.read td:first-child{color:var(--muted);width:170px}
</style>
</head>
<body>
<main>
  <h1>Eigenfaces</h1>
  <div class="grid">
    <div class="stage"><canvas id="cv"></canvas>
      <div class="legend">top: mean face and eigenfaces 1–12, blue border = in use · bars: eigenvalues, blue = first k</div></div>
    <div>
      <div class="card">
        <h2>Face x</h2>
        <select id="face"></select>
      </div>
      <div class="card">
        <h2>Number of eigenfaces k</h2>
        <div class="slider"><input id="k" type="range" min="0" max="10" step="1" value="20"><output id="ko"></output></div>
      </div>
      <div class="card">
        <h2>View</h2>
        <div class="modes" id="modes">
          <button data-m="0" class="on">Reconstruction</button><button data-m="1">Residual</button><button data-m="2">k-th eigenface only</button>
        </div>
      </div>
      <div class="card">
        <h2>Readout</h2>
        <table class="read" id="read"></table>
      </div>
    </div>
  </div>
</main>

  var bin=(typeof atob==='function')?atob(b64):Buffer.from(b64,'base64').toString('binary');
  var n=bin.length/D,F=[],i,j;
  for(i=0;i<n;i++){var f=new Float64Array(D);for(j=0;j<D;j++)f[j]=bin.charCodeAt(i*D+j)/255;F.push(f);}
  return F;
}
function jacobi(S){               // symmetric eigen-decomposition, cyclic Jacobi
  var n=S.length,A=S.map(function(r){return r.slice();}),V=[],i,j,p,q,sweep;
  for(i=0;i<n;i++){V.push(new Array(n).fill(0));V[i][i]=1;}
  for(sweep=0;sweep<60;sweep++){
    var off=0;for(p=0;p<n;p++)for(q=p+1;q<n;q++)off+=A[p][q]*A[p][q];
    if(off<1e-22)break;
    for(p=0;p<n;p++)for(q=p+1;q<n;q++){
      if(Math.abs(A[p][q])<1e-300)continue;
      var th=(A[q][q]-A[p][p])/(2*A[p][q]),t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1)),
          c=1/Math.sqrt(t*t+1),s=t*c;
      for(i=0;i<n;i++){var aip=A[i][p],aiq=A[i][q];A[i][p]=c*aip-s*aiq;A[i][q]=s*aip+c*aiq;}
      for(j=0;j<n;j++){var apj=A[p][j],aqj=A[q][j];A[p][j]=c*apj-s*aqj;A[q][j]=s*apj+c*aqj;}
      for(i=0;i<n;i++){var vip=V[i][p],viq=V[i][q];V[i][p]=c*vip-s*viq;V[i][q]=s*vip+c*viq;}
    }
  }
  var ord=[];for(i=0;i<n;i++)ord.push(i);ord.sort(function(a,b){return A[b][b]-A[a][a];});
  return {val:ord.map(function(i){return A[i][i];}),vec:ord.map(function(i){return V.map(function(r){return r[i];});})};
}
function eigenfaces(F,nTrain){
  // eigenvectors of the covariance C = Xc^T Xc / n, via the n x n matrix Xc Xc^T / n
  var n=nTrain,mean=new Float64Array(D),i,j,k;
  for(i=0;i<n;i++)for(j=0;j<D;j++)mean[j]+=F[i][j]/n;
  var Xc=[];for(i=0;i<n;i++){var r=new Float64Array(D);for(j=0;j<D;j++)r[j]=F[i][j]-mean[j];Xc.push(r);}
  var G=[];for(i=0;i<n;i++)G.push(new Array(n).fill(0));
  for(i=0;i<n;i++)for(j=i;j<n;j++){var s=0;for(k=0;k<D;k++)s+=Xc[i][k]*Xc[j][k];G[i][j]=G[j][i]=s/n;}
  var E=jacobi(G),val=[],vec=[];
  for(k=0;k<n;k++){
    if(E.val[k]<1e-9*E.val[0])break;
    var e=new Float64Array(D),nm=0;
    for(i=0;i<n;i++){var w=E.vec[k][i];for(j=0;j<D;j++)e[j]+=w*Xc[i][j];}
    for(j=0;j<D;j++)nm+=e[j]*e[j];nm=Math.sqrt(nm);for(j=0;j<D;j++)e[j]/=nm;
    val.push(E.val[k]);vec.push(e);
  }
  return {mean:mean,val:val,vec:vec};
}
function weights(M,x){
  return M.vec.map(function(e){var s=0;for(var j=0;j<D;j++)s+=e[j]*(x[j]-M.mean[j]);return s;});
}
function reconstruct(M,w,k){
  var r=new Float64Array(M.mean);
  for(var i=0;i<k;i++){var e=M.vec[i];for(var j=0;j<D;j++)r[j]+=w[i]*e[j];}
  return r;
}
function relErr(x,r){var a=0,b=0;for(var j=0;j<D;j++){a+=(x[j]-r[j])*(x[j]-r[j]);b+=x[j]*x[j];}return Math.sqrt(a/b);}
/*MATH-END*/

var $=function(id){return document.getElementById(id);};
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0;
var F=decode(DATA),M=eigenfaces(F,META.nTrain),K=M.val.length,side=META.side;
var k=20,mode=0,cur=META.extra[0].idx,total=M.val.reduce(function(a,b){return a+b;},0);
var FONT='"Segoe UI",Roboto,Arial,sans-serif';

(function(){
  var sel=$('face'),groups={};
  META.extra.forEach(function(p){
    if(!groups[p.g]){groups[p.g]=document.createElement('optgroup');groups[p.g].label=p.g;sel.appendChild(groups[p.g]);}
    var o=document.createElement('option');o.value=p.idx;o.textContent=p.n;groups[p.g].appendChild(o);
  });
  sel.value=cur;$('k').max=K;$('k').value=k;
})();

function tile(v,lo,hi){            // grayscale offscreen canvas from a vector, mapping [lo,hi] to black..white
  var c=document.createElement('canvas');c.width=c.height=side;
  var g=c.getContext('2d'),im=g.createImageData(side,side);
  for(var j=0;j<D;j++){var t=Math.max(0,Math.min(255,Math.round((v[j]-lo)/(hi-lo)*255)));
    im.data[4*j]=im.data[4*j+1]=im.data[4*j+2]=t;im.data[4*j+3]=255;}
  g.putImageData(im,0,0);return c;
}
function sym(v){var m=0;for(var j=0;j<D;j++)m=Math.max(m,Math.abs(v[j]));return m||1;}
var TOP=[tile(M.mean,0,1)];
for(var i0=0;i0<12;i0++){var m0=sym(M.vec[i0]);TOP.push(tile(M.vec[i0],-m0,m0));}

function resize(){
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
function pic(c,x,y,s,border,lw){
  ctx.imageSmoothingEnabled=true;ctx.drawImage(c,x,y,s,s);
  ctx.strokeStyle=border;ctx.lineWidth=lw;ctx.strokeRect(x,y,s,s);
}
function draw(){
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  var x=F[cur],w=weights(M,x),rec=reconstruct(M,w,k),j;
  // top row
  var gap=6,t=Math.min(84,(W-28-12*gap)/13),tx=(W-(13*t+12*gap))/2,ty=14,i;
  ctx.font='12px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';
  for(i=0;i<13;i++){
    var X=tx+i*(t+gap),used=i>=1&&i<=k;
    pic(TOP[i],X,ty,t,i===0?'#1d1f24':(used?'#3b7dd8':'#dcdcd6'),i===0?1.5:(used?3:1));
    ctx.fillStyle=used?'#3b7dd8':'#6b6f78';ctx.fillText(i===0?'mean':i,X+t/2,ty+t+5);
  }
  // bars
  var bh=Math.max(60,Math.min(110,H*0.15)),by=H-34-bh,bx0=44,bx1=W-20,bw=(bx1-bx0)/K;
  ctx.strokeStyle='#b9bcc4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx0,by+bh+0.5);ctx.lineTo(bx1,by+bh+0.5);ctx.stroke();
  for(i=0;i<K;i++){
    var h=M.val[i]/M.val[0]*bh;
    ctx.fillStyle=i<k?'#3b7dd8':'#cfd2d8';ctx.fillRect(bx0+i*bw+0.5,by+bh-h,Math.max(1,bw-1.5),h);
  }
  ctx.fillStyle='#6b6f78';ctx.font='12px '+FONT;ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText('eigenvalues λ₁ … λ'+K,bx0+8,by+4);
  // big images
  var my0=ty+t+34,my1=by-16,S=Math.min(my1-my0-26,(W-90)/2,340),G=Math.min(60,W*0.06);
  var ox=(W-(2*S+G))/2,oy=my0+26+(my1-my0-26-S)/2;
  var right,label;
  if(mode===0){right=tile(rec,0,1);label='mean + '+k+' eigenface'+(k===1?'':'s');}
  else if(mode===1){var d=new Float64Array(D);for(j=0;j<D;j++)d[j]=x[j]-rec[j];right=tile(d,-0.5,0.5);label='residual x − reconstruction';}
  else{var c=new Float64Array(D);if(k>=1)for(j=0;j<D;j++)c[j]=w[k-1]*M.vec[k-1][j];right=tile(c,-0.5,0.5);
    label=k>=1?('weight × eigenface '+k):'–';}
  pic(tile(x,0,1),ox,oy,S,'#e8801a',3);
  pic(right,ox+S+G,oy,S,'#3b7dd8',3);
  ctx.font='600 15px '+FONT;ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillStyle='#e8801a';ctx.fillText('x',ox,oy-8);
  ctx.fillStyle='#3b7dd8';ctx.fillText(label,ox+S+G,oy-8);
  readout(x,w,rec);
}
function readout(x,w,rec){
  var cap=0;for(var i=0;i<k;i++)cap+=M.val[i];
  var rows=[
    ['pixels per image',side+' × '+side+' = '+D],
    ['faces in the set',META.nTrain],
    ['eigenfaces available',K],
    ['k',k],
    ['numbers stored',k+' of '+D],
    ['weight of eigenface k',k>=1?w[k-1].toFixed(2):'–'],
    ['λ₁ + … + λk, share',(100*cap/total).toFixed(1)+' %'],
    ['‖x − reconstruction‖ / ‖x‖',relErr(x,rec).toFixed(3)]
  ];
  $('read').innerHTML=rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('');
  $('ko').textContent=k;
}
$('face').addEventListener('change',function(){cur=+this.value;draw();});
$('k').addEventListener('input',function(){k=+this.value;draw();});
$('modes').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;
  Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b);});draw();
});
window.addEventListener('resize',resize);
resize();
</script>
</body>
