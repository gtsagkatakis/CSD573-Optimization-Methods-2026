<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient descent: the O(1/k) bound</title>
<style>
  :root{--bg:#fbfbf9;--ink:#1d1f24;--muted:#6b6f78;--line:#dcdcd6;--blue:#3b7dd8;--red:#d23c3c;--orange:#e8801a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  header{padding:18px 24px 6px}
  h1{margin:0;font-size:22px;font-weight:600}
  main{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:12px 24px 24px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .stage{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:520px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px}
  .card h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .cv{height:360px}
  .sidebar{display:flex;flex-direction:column;gap:12px}
  select{width:100%;font:inherit;padding:6px}
  .row{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;margin-top:8px}
  .row label{font-size:14px;color:var(--muted)}
  .row input[type=range]{width:100%;grid-column:1/2}
  output{font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:3px 0;vertical-align:top}
  td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .leg{position:absolute;right:16px;top:12px;font-size:12px;color:var(--muted)}
  .wrap{position:relative;height:100%}
  .warn{color:var(--red)}
</style>
</head>
<body>
<header><h1>Gradient descent: the O(1/k) bound</h1></header>
<main>
  <div class="stage">
    <div class="card"><div class="wrap"><canvas id="cPath" class="cv"></canvas></div></div>
    <div class="card"><div class="wrap"><canvas id="cRate" class="cv"></canvas>
      <div class="leg"><span style="color:var(--blue)">■</span> f(x<sup>k</sup>) − f<sup>⋆</sup> &nbsp; <span style="color:var(--red)">- -</span> ‖x<sup>0</sup> − x<sup>⋆</sup>‖²/(2αk)</div></div></div>
  </div>
  <aside class="sidebar">
    <div class="card"><h2>Function f</h2>
      <select id="preset">
        <optgroup label="Quadratic">
          <option value="q1">Round bowl — ½(x₁² + 2x₂²)</option>
          <option value="q50">Stretched bowl — ½(0.02x₁² + x₂²)</option>
        </optgroup>
        <optgroup label="Not strongly convex">
          <option value="quartic">Quartic bowl — ¼(x₁⁴ + x₂⁴)</option>
          <option value="lse">Log-sum-exp — log(eˣ¹ + eˣ² + e⁻ˣ¹⁻ˣ²)</option>
        </optgroup>
      </select>
    </div>
    <div class="card"><h2>Step size and iterations</h2>
      <div class="row"><label for="alpha">α · L</label><output id="alphaOut">1.00</output><input id="alpha" type="range" min="0.05" max="2.5" step="0.05" value="1"></div>
      <div class="row"><label for="k">k</label><output id="kOut">20</output><input id="k" type="range" min="1" max="200" step="1" value="20"></div>
    </div>
    <div class="card"><h2>Readout</h2>
      <table id="ro"></table>
    </div>
  </aside>
</main>
<script>
(function(){
const BLUE='#3b7dd8',RED='#d23c3c',ORANGE='#e8801a',INK='#1d1f24',MUTED='#6b6f78';
const KMAX=200, BOX=2.5;

const presets={
  q1:{ A:[[1,0],[0,2]], L:2, xs:[0,0],
       f:x=>0.5*(x[0]*x[0]+2*x[1]*x[1]), g:x=>[x[0],2*x[1]] },
  q50:{ A:null, L:1, xs:[0,0],
       f:x=>0.5*(0.02*x[0]*x[0]+x[1]*x[1]), g:x=>[0.02*x[0],x[1]] },
  quartic:{ L:3*BOX*BOX, xs:[0,0],
       f:x=>(x[0]**4+x[1]**4)/4, g:x=>[x[0]**3,x[1]**3] },
  lse:{ L:2, xs:[0,0],
       f:x=>{const a=x[0],b=x[1],c=-x[0]-x[1];const m=Math.max(a,b,c);return m+Math.log(Math.exp(a-m)+Math.exp(b-m)+Math.exp(c-m));},
       g:x=>{const a=x[0],b=x[1],c=-x[0]-x[1];const m=Math.max(a,b,c);const ea=Math.exp(a-m),eb=Math.exp(b-m),ec=Math.exp(c-m),s=ea+eb+ec;const pa=ea/s,pb=eb/s,pc=ec/s;return [pa-pc,pb-pc];} }
};

let P=presets.q1, x0=[2.0,1.6], alphaL=1, K=20;
let iter=[], gaps=[], bound=[], fstar=0;

function run(){
  fstar=P.f(P.xs);
  const alpha=alphaL/P.L;
  iter=[x0.slice()]; gaps=[]; bound=[];
  let x=x0.slice();
  const d2=(x0[0]-P.xs[0])**2+(x0[1]-P.xs[1])**2;
  for(let k=1;k<=KMAX;k++){
    const g=P.g(x);
    x=[x[0]-alpha*g[0],x[1]-alpha*g[1]];
    if(!isFinite(x[0])||!isFinite(x[1])||Math.abs(x[0])>1e150||Math.abs(x[1])>1e150) x=[NaN,NaN];
    iter.push(x);
    gaps.push(isFinite(x[0])?P.f(x)-fstar:NaN);
    bound.push(d2/(2*alpha*k));
  }
}

// ---------- canvas helpers ----------
function setup(cv){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w:r.width,h:r.height};
}

// marching squares contours
function contours(ctx,fn,toPx,levels,n){
  const F=new Float64Array((n+1)*(n+1));
  for(let j=0;j<=n;j++)for(let i=0;i<=n;i++){
    const x=-BOX+2*BOX*i/n,y=-BOX+2*BOX*j/n;F[j*(n+1)+i]=fn([x,y]);
  }
  ctx.strokeStyle='#cfd3d8';ctx.lineWidth=1;
  for(const lv of levels){
    ctx.beginPath();
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){
      const x0=-BOX+2*BOX*i/n,x1=-BOX+2*BOX*(i+1)/n,y0=-BOX+2*BOX*j/n,y1=-BOX+2*BOX*(j+1)/n;
      const a=F[j*(n+1)+i],b=F[j*(n+1)+i+1],c=F[(j+1)*(n+1)+i+1],d=F[(j+1)*(n+1)+i];
      const pts=[];
      const e=(p,q,pv,qv)=>{const t=(lv-pv)/(qv-pv);return [p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])];};
      if((a<lv)!==(b<lv))pts.push(e([x0,y0],[x1,y0],a,b));
      if((b<lv)!==(c<lv))pts.push(e([x1,y0],[x1,y1],b,c));
      if((c<lv)!==(d<lv))pts.push(e([x1,y1],[x0,y1],c,d));
      if((d<lv)!==(a<lv))pts.push(e([x0,y1],[x0,y0],d,a));
      if(pts.length>=2){const p=toPx(pts[0]),q=toPx(pts[1]);ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);
        if(pts.length===4){const r=toPx(pts[2]),s=toPx(pts[3]);ctx.moveTo(r[0],r[1]);ctx.lineTo(s[0],s[1]);}}
    }
    ctx.stroke();
  }
}

function drawPath(){
  const cv=document.getElementById('cPath');const {ctx,w,h}=setup(cv);
  ctx.clearRect(0,0,w,h);
  const S=Math.min(w,h)-20, ox=(w-S)/2, oy=(h-S)/2;
  const toPx=p=>[ox+(p[0]+BOX)/(2*BOX)*S, oy+S-(p[1]+BOX)/(2*BOX)*S];
  cv._toXY=px=>[(px[0]-ox)/S*2*BOX-BOX, (S-(px[1]-oy))/S*2*BOX-BOX];
  // frame + axes
  ctx.strokeStyle='#e4e4df';ctx.lineWidth=1;ctx.strokeRect(ox,oy,S,S);
  ctx.setLineDash([3,4]);ctx.strokeStyle='#c8c8c2';
  const c=toPx([0,0]);ctx.beginPath();ctx.moveTo(ox,c[1]);ctx.lineTo(ox+S,c[1]);ctx.moveTo(c[0],oy);ctx.lineTo(c[0],oy+S);ctx.stroke();ctx.setLineDash([]);
  // contour levels: quantiles of f on the box
  const vals=[];for(let j=0;j<=40;j++)for(let i=0;i<=40;i++)vals.push(P.f([-BOX+2*BOX*i/40,-BOX+2*BOX*j/40]));
  vals.sort((a,b)=>a-b);
  const levels=[];for(let q=0.03;q<0.98;q+=0.07)levels.push(vals[Math.floor(q*vals.length)]);
  ctx.save();ctx.beginPath();ctx.rect(ox,oy,S,S);ctx.clip();
  contours(ctx,P.f,toPx,levels,80);
  // path
  ctx.strokeStyle=BLUE;ctx.lineWidth=1.5;ctx.beginPath();
  let last=0;
  for(let k=0;k<=K;k++){const p=iter[k];if(!isFinite(p[0]))break;const q=toPx(p);k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);last=k;}
  ctx.stroke();
  ctx.fillStyle=BLUE;
  for(let k=1;k<=last;k++){const q=toPx(iter[k]);ctx.beginPath();ctx.arc(q[0],q[1],2.5,0,7);ctx.fill();}
  ctx.restore();
  // x*
  const s=toPx(P.xs);ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s[0]-6,s[1]-6);ctx.lineTo(s[0]+6,s[1]+6);ctx.moveTo(s[0]-6,s[1]+6);ctx.lineTo(s[0]+6,s[1]-6);ctx.stroke();
  ctx.fillStyle=INK;ctx.font='14px "Segoe UI",Roboto,Arial';ctx.fillText('x⋆',s[0]+9,s[1]-6);
  // x0
  const o=toPx(x0);ctx.fillStyle=ORANGE;ctx.beginPath();ctx.arc(o[0],o[1],6,0,7);ctx.fill();
  ctx.fillText('x⁰',o[0]+9,o[1]-6);
  // x^k
  if(last===K){const q=toPx(iter[K]);ctx.fillStyle=BLUE;ctx.beginPath();ctx.arc(q[0],q[1],5,0,7);ctx.fill();ctx.fillStyle=INK;ctx.fillText('xᵏ',q[0]+9,q[1]+14);}
  ctx.fillStyle=MUTED;ctx.font='12px "Segoe UI",Roboto,Arial';ctx.fillText('x₁',ox+S-16,c[1]-6);ctx.fillText('x₂',c[0]+6,oy+12);
}

function drawRate(){
  const cv=document.getElementById('cRate');const {ctx,w,h}=setup(cv);
  ctx.clearRect(0,0,w,h);
  const ml=64,mr=16,mt=28,mb=34;const W=w-ml-mr,H=h-mt-mb;
  const fin=gaps.filter(v=>isFinite(v)&&v>0);
  let ymin=Math.min(...fin,...bound),ymax=Math.max(...fin,...bound);
  if(!isFinite(ymin)){ymin=1e-3;ymax=1;}
  ymin=Math.max(ymin,1e-16);
  let lo=Math.floor(Math.log10(ymin)),hi=Math.ceil(Math.log10(ymax));if(hi-lo<2)hi=lo+2;
  const X=k=>ml+W*Math.log10(k)/Math.log10(KMAX);
  const Y=v=>mt+H*(hi-Math.log10(v))/(hi-lo);
  // grid
  ctx.strokeStyle='#eceae4';ctx.lineWidth=1;ctx.fillStyle=MUTED;ctx.font='12px "Segoe UI",Roboto,Arial';ctx.textAlign='right';
  const step=Math.max(1,Math.ceil((hi-lo)/6));
  for(let e=lo;e<=hi;e+=step){const y=Y(10**e);ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(ml+W,y);ctx.stroke();ctx.fillText('1e'+e,ml-6,y+4);}
  ctx.textAlign='center';
  for(const k of [1,2,5,10,20,50,100,200]){const x=X(k);ctx.beginPath();ctx.moveTo(x,mt);ctx.lineTo(x,mt+H);ctx.stroke();ctx.fillText(k,x,mt+H+16);}
  ctx.fillText('k',ml+W/2,mt+H+32);
  ctx.strokeStyle='#dcdcd6';ctx.strokeRect(ml,mt,W,H);
  ctx.save();ctx.beginPath();ctx.rect(ml,mt,W,H);ctx.clip();
  // bound
  ctx.strokeStyle=RED;ctx.setLineDash([6,5]);ctx.lineWidth=1.5;ctx.beginPath();
  for(let k=1;k<=KMAX;k++){const v=bound[k-1];k===1?ctx.moveTo(X(k),Y(v)):ctx.lineTo(X(k),Y(v));}
  ctx.stroke();ctx.setLineDash([]);
  // gaps
  ctx.strokeStyle=BLUE;ctx.lineWidth=2;ctx.beginPath();let started=false;
  for(let k=1;k<=KMAX;k++){const v=gaps[k-1];if(!(isFinite(v)&&v>0)){started=false;continue;}const x=X(k),y=Y(v);started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;}
  ctx.stroke();
  // current k marker
  ctx.strokeStyle=ORANGE;ctx.setLineDash([4,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(K),mt);ctx.lineTo(X(K),mt+H);ctx.stroke();ctx.setLineDash([]);
  const gk=gaps[K-1];if(isFinite(gk)&&gk>0){ctx.fillStyle=BLUE;ctx.beginPath();ctx.arc(X(K),Y(gk),4,0,7);ctx.fill();}
  ctx.restore();
}

function readout(){
  const alpha=alphaL/P.L,d2=(x0[0]-P.xs[0])**2+(x0[1]-P.xs[1])**2;
  const gk=gaps[K-1],bk=bound[K-1];
  const fmt=v=>!isFinite(v)?'<span class="warn">diverged</span>':(Math.abs(v)<1e-3||Math.abs(v)>=1e4)?v.toExponential(2):v.toFixed(4);
  const rows=[
    ['L',P.L.toFixed(2)],
    ['α',fmt(alpha)],
    ['‖x⁰ − x⋆‖²',d2.toFixed(3)],
    ['f(xᵏ) − f⋆',fmt(gk)],
    ['‖x⁰ − x⋆‖²/(2αk)',fmt(bk)]
  ];
  document.getElementById('ro').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
}

function update(){run();drawPath();drawRate();readout();}

const presetEl=document.getElementById('preset'),alphaEl=document.getElementById('alpha'),kEl=document.getElementById('k');
presetEl.addEventListener('change',()=>{P=presets[presetEl.value];update();});
alphaEl.addEventListener('input',()=>{alphaL=+alphaEl.value;document.getElementById('alphaOut').value=alphaL.toFixed(2);update();});
kEl.addEventListener('input',()=>{K=+kEl.value;document.getElementById('kOut').value=K;update();});
const cp=document.getElementById('cPath');
function setX0(ev){const r=cp.getBoundingClientRect();const p=cp._toXY([ev.clientX-r.left,ev.clientY-r.top]);
  x0=[Math.max(-BOX,Math.min(BOX,p[0])),Math.max(-BOX,Math.min(BOX,p[1]))];update();}
let drag=false;
cp.addEventListener('pointerdown',e=>{drag=true;cp.setPointerCapture(e.pointerId);setX0(e);});
cp.addEventListener('pointermove',e=>{if(drag)setX0(e);});
cp.addEventListener('pointerup',()=>drag=false);
window.addEventListener('resize',update);
update();
})();
</script>
</body>
</html>
