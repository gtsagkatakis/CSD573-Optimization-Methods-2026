<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS-573 · Eigen-signals</title>
<style>
  :root{--ink:#1d1f24;--muted:#6b6f78;--paper:#fbfbf9;--panel:#fff;--rule:#dcdcd6;--blue:#3b7dd8;--x:#e8801a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:16px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  main{max-width:1360px;margin:0 auto;padding:18px 22px 26px}
  h1{font-size:22px;font-weight:600;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}
  .stage{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    min-height:560px;height:calc(100vh - 90px);max-height:780px}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .legend{position:absolute;left:12px;bottom:8px;font-size:13px;color:var(--muted);pointer-events:none}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:10px 14px 12px;margin-bottom:12px}
  .card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
  select{font:inherit;width:100%;padding:5px 6px;border:1px solid var(--rule);border-radius:5px;background:#fff}
  .slider{display:grid;grid-template-columns:1fr 40px;gap:10px;align-items:center}
  .slider output{text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .modes{display:grid;gap:0}
  .modes.col{grid-template-columns:1fr}
  .modes.row{grid-template-columns:1fr 1fr}
  .modes button{font:inherit;font-size:15px;padding:6px 4px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
  .modes.col button{margin-top:-1px}
  .modes.col button:first-child{margin-top:0;border-radius:5px 5px 0 0}
  .modes.col button:last-child{border-radius:0 0 5px 5px}
  .modes.row button{margin-left:-1px}
  .modes.row button:first-child{margin-left:0;border-radius:5px 0 0 5px}
  .modes.row button:last-child{border-radius:0 5px 5px 0}
  .modes button.on{background:var(--ink);color:#fff}
  table.read{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
  table.read td{padding:3px 0;vertical-align:top}
  table.read td:first-child{color:var(--muted);width:165px}
  .kx{color:var(--x)} .kb{color:var(--blue)}
</style>
</head>
<body>
<main>
  <h1>Eigen-signals</h1>
  <div class="grid">
    <div class="stage"><canvas id="cv"></canvas></div>
    <div>
      <div class="card">
        <h2>Signal x</h2>
        <select id="sig"></select>
      </div>
      <div class="card">
        <h2>Number of eigen-signals k</h2>
        <div class="slider"><input id="k" type="range" min="0" max="10" step="1" value="2"><output id="ko"></output></div>
      </div>
      <div class="card">
        <h2>Signal view</h2>
        <div class="modes col" id="modes">
          <button data-m="0" class="on">Reconstruction</button><button data-m="1">Residual</button>
        </div>
      </div>
      <div class="card">
        <h2>Readout</h2>
        <table class="read" id="read"></table>
      </div>
    </div>
  </div>
</main>
<script>
/*MATH-START*/
var N=64,NSET=90;
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=rng32(573);
function gauss(){var u=Math.max(1e-12,rnd()),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function bump(c,w){return function(t){return Math.exp(-0.5*Math.pow((t-c)/w,2));};}
var gL=bump(0.3,0.08),gR=bump(0.7,0.08),gM=bump(0.5,0.08);
function arch(t){return Math.sin(Math.PI*t);}
function build(f,noise){var x=new Float64Array(N);for(var i=0;i<N;i++)x[i]=f(i/(N-1))+noise*gauss();return x;}
// three kinds: 0 left peak, 1 right peak, 2 two peaks; all sit on a slow arch of varying height
var KIND=[[1.0,0.15],[0.15,1.0],[0.7,0.7]];
function sample(kind){
  var a=KIND[kind][0]+0.08*gauss(),b=KIND[kind][1]+0.08*gauss(),c=0.5+0.18*gauss();
  return build(function(t){return a*gL(t)+b*gR(t)+c*arch(t);},0.03);
}
var SIG=[],GROUP=[];
(function(){
  for(var i=0;i<NSET;i++){SIG.push(sample(i%3));GROUP.push(i%3);}
  for(var k=0;k<3;k++){SIG.push(sample(k));GROUP.push(k);}                       // 90..92 new, same kinds
  SIG.push(build(function(t){return 1.0*gM(t)+0.5*arch(t);},0.03));GROUP.push(-1);   // 93 middle peak
  SIG.push(build(function(t){return (t>0.4&&t<0.6?1:0)+0.5*arch(t);},0.03));GROUP.push(-1); // 94 square pulse
  SIG.push(build(function(t){return 1.2*t;},0.03));GROUP.push(-1);                  // 95 ramp
})();
var OPTIONS=[
  {g:'In the set',n:'Left peak',idx:0},{g:'In the set',n:'Right peak',idx:1},{g:'In the set',n:'Two peaks',idx:2},
  {g:'New signal, kind in the set',n:'Left peak, new',idx:90},{g:'New signal, kind in the set',n:'Right peak, new',idx:91},
  {g:'New signal, kind in the set',n:'Two peaks, new',idx:92},
  {g:'Different kind of signal',n:'Middle peak',idx:93},{g:'Different kind of signal',n:'Square pulse',idx:94},
  {g:'Different kind of signal',n:'Ramp',idx:95}
];
function jacobi(S){
  var n=S.length,A=S.map(function(r){return r.slice();}),V=[],i,j,p,q,sweep;
  for(i=0;i<n;i++){V.push(new Array(n).fill(0));V[i][i]=1;}
  for(sweep=0;sweep<60;sweep++){
    var off=0;for(p=0;p<n;p++)for(q=p+1;q<n;q++)off+=A[p][q]*A[p][q];
    if(off<1e-24)break;
    for(p=0;p<n;p++)for(q=p+1;q<n;q++){
      if(Math.abs(A[p][q])<1e-300)continue;
      var th=(A[q][q]-A[p][p])/(2*A[p][q]),t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1)),
          c=1/Math.sqrt(t*t+1),s=t*c;
      for(i=0;i<n;i++){var aip=A[i][p],aiq=A[i][q];A[i][p]=c*aip-s*aiq;A[i][q]=s*aip+c*aiq;}
      for(j=0;j<n;j++){var apj=A[p][j],aqj=A[q][j];A[p][j]=c*apj-s*aqj;A[q][j]=s*apj+c*aqj;}
      for(i=0;i<n;i++){var vip=V[i][p],viq=V[i][q];V[i][p]=c*vip-s*viq;V[i][q]=s*vip+c*viq;}
    }
  }
  var ord=[];for(i=0;i<n;i++)ord.push(i);ord.sort(function(a,b){return A[b][b]-A[a][a];});
  return {val:ord.map(function(i){return A[i][i];}),vec:ord.map(function(i){return V.map(function(r){return r[i];});})};
}
function model(){
  var mean=new Float64Array(N),i,j,s,C=[];
  for(s=0;s<NSET;s++)for(i=0;i<N;i++)mean[i]+=SIG[s][i]/NSET;
  for(i=0;i<N;i++)C.push(new Array(N).fill(0));
  for(s=0;s<NSET;s++)for(i=0;i<N;i++){var d=SIG[s][i]-mean[i];for(j=i;j<N;j++)C[i][j]+=d*(SIG[s][j]-mean[j])/NSET;}
  for(i=0;i<N;i++)for(j=0;j<i;j++)C[i][j]=C[j][i];
  var E=jacobi(C),val=[],vec=[];
  for(var k=0;k<N;k++){
    if(E.val[k]<1e-9*E.val[0])break;
    var e=Float64Array.from(E.vec[k]),big=0;
    for(i=0;i<N;i++)if(Math.abs(e[i])>Math.abs(big))big=e[i];
    if(big<0)for(i=0;i<N;i++)e[i]=-e[i];
    val.push(E.val[k]);vec.push(e);
  }
  return {mean:mean,val:val,vec:vec,C:C};
}
function weights(M,x){return M.vec.map(function(e){var s=0;for(var i=0;i<N;i++)s+=e[i]*(x[i]-M.mean[i]);return s;});}
function reconstruct(M,w,k){var r=new Float64Array(M.mean);for(var q=0;q<k;q++){var e=M.vec[q];for(var i=0;i<N;i++)r[i]+=w[q]*e[i];}return r;}
function relErr(x,r){var a=0,b=0;for(var i=0;i<N;i++){a+=(x[i]-r[i])*(x[i]-r[i]);b+=x[i]*x[i];}return Math.sqrt(a/b);}
/*MATH-END*/

var $=function(id){return document.getElementById(id);};
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0;
var M=model(),K=M.val.length,WT=SIG.map(function(x){return weights(M,x);});
var total=M.val.reduce(function(a,b){return a+b;},0);
var k=2,mode=0,dim=2,cur=0,yaw=-0.6,pitch=0.45,VP=null,dots=[],TIP=null;
var X=Float64Array.from(SIG[0]),Wx=WT[0].slice();      // the current signal and its weights (movable)
function setCur(i){cur=i;X=Float64Array.from(SIG[i]);Wx=WT[i].slice();}
function setPure(a,b){                                   // exactly mean + a e1 + b e2, all other weights zero
  cur=-1;X=new Float64Array(N);Wx=new Array(K).fill(0);Wx[0]=a;Wx[1]=b;
  for(var i=0;i<N;i++)X[i]=M.mean[i]+a*M.vec[0][i]+b*M.vec[1][i];
}
function moveTo(a,b){                                    // set weights 1 and 2, keep all the others
  var d0=a-Wx[0],d1=b-Wx[1];for(var i=0;i<N;i++)X[i]+=d0*M.vec[0][i]+d1*M.vec[1][i];Wx[0]=a;Wx[1]=b;
}
var GC=['#1f5fbf','#2a9d5c','#8a4fc9'];
var FONT='"Segoe UI",Roboto,Arial,sans-serif';
function ext(d){var m=0;WT.forEach(function(w){for(var i=0;i<d;i++)m=Math.max(m,Math.abs(w[i]));});return m*1.12;}
var EXT2=ext(2),EXT3=ext(3);
var WMAX=(function(){var m=0;WT.forEach(function(w){w.forEach(function(v){m=Math.max(m,Math.abs(v));});});return m*1.05;})();

(function(){
  var sel=$('sig'),groups={};
  OPTIONS.forEach(function(p){
    if(!groups[p.g]){groups[p.g]=document.createElement('optgroup');groups[p.g].label=p.g;sel.appendChild(groups[p.g]);}
    var o=document.createElement('option');o.value=p.idx;o.textContent=p.n;groups[p.g].appendChild(o);
  });
  var sd1=Math.round(Math.sqrt(M.val[0])*10)/10,sd2=Math.round(Math.sqrt(M.val[1])*10)/10,ge=document.createElement('optgroup');
  ge.label='Along the eigen-signals';sel.appendChild(ge);
  [['Mean signal',0,0],['Mean + '+sd1+' × eigen-signal 1',sd1,0],['Mean − '+sd1+' × eigen-signal 1',-sd1,0],
   ['Mean + '+sd2+' × eigen-signal 2',0,sd2],['Mean − '+sd2+' × eigen-signal 2',0,-sd2]].forEach(function(p){
    var o=document.createElement('option');o.value='e:'+p[1]+','+p[2];o.textContent=p[0];ge.appendChild(o);});
  var e=document.createElement('option');e.value='picked';e.textContent='Picked from the plot';e.hidden=true;sel.appendChild(e);
  e=document.createElement('option');e.value='moved';e.textContent='Moved in the plot';e.hidden=true;sel.appendChild(e);
  sel.value=0;$('k').max=K;$('k').value=k;
})();

function f2(v){var t=Math.abs(v)<0.005?0:v;return t.toFixed(2);}
function resize(){
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
function curve(v,x0,y0,w,h,lo,hi,col,lw){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();
  for(var i=0;i<N;i++){var X=x0+i/(N-1)*w,Y=y0+(hi-v[i])/(hi-lo)*h;if(i)ctx.lineTo(X,Y);else ctx.moveTo(X,Y);}
  ctx.stroke();ctx.restore();
}
function drawCurves(R,x,w,rec){
  // R = {x,y,w,h} region
  var nT=6,gap=8,tw=(R.w-(nT-1)*gap)/nT,th=Math.min(70,R.h*0.14),i,j;
  ctx.font='12px '+FONT;ctx.textAlign='center';ctx.textBaseline='top';
  for(i=0;i<nT;i++){
    var X=R.x+i*(tw+gap),used=i>=1&&i<=k,v=i===0?M.mean:M.vec[i-1],m=0;
    for(j=0;j<N;j++)m=Math.max(m,Math.abs(v[j]));
    ctx.strokeStyle=i===0?'#1d1f24':(used?'#3b7dd8':'#dcdcd6');ctx.lineWidth=i===0?1.5:(used?2.5:1);
    ctx.strokeRect(X,R.y,tw,th);
    if(i>0){ctx.strokeStyle='#e4e4de';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(X+3,R.y+th/2);ctx.lineTo(X+tw-3,R.y+th/2);ctx.stroke();}
    curve(v,X+5,R.y+6,tw-10,th-12,i===0?-0.1*m:-m,m,i===0?'#1d1f24':(used?'#3b7dd8':'#8d919a'),1.6);
    ctx.fillStyle=used?'#3b7dd8':'#6b6f78';ctx.fillText(i===0?'mean':i,X+tw/2,R.y+th+4);
  }
  // weights of x on each eigen-signal (signed bars)
  var bh=Math.max(64,Math.min(104,R.h*0.17)),by=R.y+R.h-bh,bw=R.w/K,b0=by+bh/2;
  ctx.strokeStyle='#b9bcc4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(R.x,b0+0.5);ctx.lineTo(R.x+R.w,b0+0.5);ctx.stroke();
  for(i=0;i<K;i++){var hh=Math.max(-1,Math.min(1,w[i]/WMAX))*bh/2;ctx.fillStyle=i<k?'#3b7dd8':'#b4b8c0';
    ctx.fillRect(R.x+i*bw+0.5,hh>=0?b0-hh:b0,Math.max(1,bw-1.5),Math.max(Math.abs(hh),0.6));}
  ctx.fillStyle='#6b6f78';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('weights of x on eigen-signals 1 … '+K,R.x+R.w,by-6);
  // main plot
  var py=R.y+th+44,ph=by-18-py,lo=-0.7,hi=2.0,px=R.x+30,pw=R.w-30;
  ctx.textAlign='right';ctx.textBaseline='middle';
  [-0.5,0,0.5,1,1.5,2].forEach(function(t){
    var Y=py+(hi-t)/(hi-lo)*ph;ctx.strokeStyle=t===0?'#b9bcc4':'#ececE6';ctx.lineWidth=t===0?1.2:1;
    ctx.beginPath();ctx.moveTo(px,Y);ctx.lineTo(px+pw,Y);ctx.stroke();ctx.fillStyle='#6b6f78';ctx.fillText(t.toFixed(1),px-6,Y);
  });
  var second=new Float64Array(N),label;
  if(mode===0){second=rec;label='mean + '+k+' eigen-signal'+(k===1?'':'s');}
  else{for(j=0;j<N;j++)second[j]=x[j]-rec[j];label='residual x − reconstruction';}
  curve(x,px,py,pw,ph,lo,hi,'#e8801a',2.4);
  curve(second,px,py,pw,ph,lo,hi,'#3b7dd8',2.4);
  ctx.font='600 14px '+FONT;ctx.textBaseline='bottom';ctx.textAlign='left';
  ctx.fillStyle='#e8801a';ctx.fillText('x',px,py-4);
  ctx.fillStyle='#3b7dd8';ctx.fillText(label,px+22,py-4);
}
function proj(p){        // weights (w1,w2,w3) to screen
  if(dim===2)return {X:VP.cx+p[0]*VP.sc,Y:VP.cy-p[1]*VP.sc,d:0};
  var cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  var xr=p[0]*cy-p[1]*sy,yr=p[0]*sy+p[1]*cy;
  return {X:VP.cx+xr*VP.sc,Y:VP.cy-(p[2]*cp-yr*sp)*VP.sc,d:yr*cp+p[2]*sp};
}
function vline(a,b,col,lw,dash){
  var p=proj(a),q=proj(b);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(p.X,p.Y);ctx.lineTo(q.X,q.Y);ctx.stroke();ctx.restore();
}
function varrow(v,col,lw){
  var o=proj([0,0,0]),p=proj(v),dx=p.X-o.X,dy=p.Y-o.Y,L=Math.hypot(dx,dy);
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;
  if(L<3){ctx.beginPath();ctx.arc(o.X,o.Y,lw+2,0,7);ctx.fill();ctx.restore();return;}
  var ux=dx/L,uy=dy/L,h=Math.min(12,L*0.6);
  ctx.beginPath();ctx.moveTo(o.X,o.Y);ctx.lineTo(p.X-ux*h*0.8,p.Y-uy*h*0.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(p.X,p.Y);ctx.lineTo(p.X-ux*h-uy*h*0.45,p.Y-uy*h+ux*h*0.45);
  ctx.lineTo(p.X-ux*h+uy*h*0.45,p.Y-uy*h-ux*h*0.45);ctx.closePath();ctx.fill();ctx.restore();
}
function drawVectors(R,w){
  var half=Math.min(R.w,R.h)/2-(dim===3?40:46),E=dim===3?EXT3:EXT2,i;
  VP={cx:R.x+R.w/2,cy:R.y+R.h/2,sc:half/(dim===3?E*0.95:E),R:R};
  var step=E>3?1:0.5,nG=Math.floor(E/step);
  if(dim===2){
    for(i=-nG;i<=nG;i++){vline([i*step,-E,0],[i*step,E,0],'#ececE6',1);vline([-E,i*step,0],[E,i*step,0],'#ececE6',1);}
  }else{
    for(i=-nG;i<=nG;i++){vline([i*step,-nG*step,0],[i*step,nG*step,0],'#ececE6',1);vline([-nG*step,i*step,0],[nG*step,i*step,0],'#ececE6',1);}
  }
  var axes=[[E,0,0],[0,E,0]];if(dim===3)axes.push([0,0,E]);
  ctx.font='13px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  axes.forEach(function(a,q){
    var used=q<k;vline([-a[0],-a[1],-a[2]],a,used?'#3b7dd8':'#b9bcc4',used?1.8:1.3);
    var t=proj([a[0]*1.07,a[1]*1.07,a[2]*1.07]);ctx.fillStyle=used?'#3b7dd8':'#6b6f78';ctx.fillText('weight '+(q+1),t.X,t.Y);
  });
  dots=[];
  for(i=0;i<NSET;i++){var p=proj([WT[i][0],WT[i][1],dim===3?WT[i][2]:0]);dots.push({i:i,X:p.X,Y:p.Y,d:p.d});}
  dots.slice().sort(function(a,b){return a.d-b.d;}).forEach(function(q){
    ctx.fillStyle=GC[GROUP[q.i]];ctx.globalAlpha=0.55;ctx.beginPath();ctx.arc(q.X,q.Y,4,0,7);ctx.fill();ctx.globalAlpha=1;
  });
  var full=[w[0],w[1],dim===3?w[2]:0],cut=[k>=1?w[0]:0,k>=2?w[1]:0,(dim===3&&k>=3)?w[2]:0];
  vline(full,cut,'#555',1.2,[4,4]);
  varrow(full,'#e8801a',3);
  varrow(cut,'#3b7dd8',2.2);
  var t=proj(full);ctx.fillStyle='#fff';ctx.strokeStyle='#e8801a';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(t.X,t.Y,7,0,7);ctx.fill();ctx.stroke();
  TIP={X:t.X,Y:t.Y};
}
function draw(){
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  var x=X,w=Wx,rec=reconstruct(M,w,k),side=W>=700,RC,RV;
  if(side){RC={x:16,y:14,w:W*0.56-26,h:H-58};RV={x:W*0.56+6,y:14,w:W*0.44-20,h:H-58};}
  else{RC={x:14,y:12,w:W-28,h:H*0.56-20};RV={x:14,y:H*0.56,w:W-28,h:H*0.44-34};}
  drawCurves(RC,x,w,rec);
  drawVectors(RV,w);
  readout(x,w,rec);
}
function readout(x,w,rec){
  var cap=0,i;for(i=0;i<k;i++)cap+=M.val[i];
  var ws=[];for(i=0;i<Math.min(k,4);i++)ws.push(f2(w[i]));
  var rows=[
    ['samples per signal',N],
    ['signals in the set',NSET],
    ['k',k],
    ['numbers stored',k+' of '+N],
    ['weights',k===0?'–':'<span class="kb">('+ws.join(', ')+(k>4?', …':'')+')</span>'],
    ['λ₁ + … + λk, share',(100*cap/total).toFixed(1)+' %'],
    ['relative error',relErr(x,rec).toFixed(3)]
  ];
  $('read').innerHTML=rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('');
  $('ko').textContent=k;
}
$('sig').addEventListener('change',function(){
  var v=this.value;if(v==='picked'||v==='moved')return;
  if(v.indexOf('e:')===0){var p=v.slice(2).split(',');setPure(+p[0],+p[1]);}else setCur(+v);
  draw();
});
$('k').addEventListener('input',function(){k=+this.value;draw();});
function bind(id,key,fn){
  $(id).addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;fn(+b.dataset[key]);
    Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b);});draw();
  });
}
bind('modes','m',function(v){mode=v;});
var down=null;
function local(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function inV(p){return VP&&p[0]>=VP.R.x&&p[0]<=VP.R.x+VP.R.w&&p[1]>=VP.R.y&&p[1]<=VP.R.y+VP.R.h;}
function onTip(p){return TIP&&Math.hypot(p[0]-TIP.X,p[1]-TIP.Y)<16;}
function unproject(p){     // screen point to weights (1,2), on the plane of the current weight 3 in 3D
  var E=dim===3?EXT3:EXT2,a,b;
  if(dim===2){a=(p[0]-VP.cx)/VP.sc;b=-(p[1]-VP.cy)/VP.sc;}
  else{
    var sp=Math.sin(pitch),cp=Math.cos(pitch);if(Math.abs(sp)<0.08)return null;
    var xr=(p[0]-VP.cx)/VP.sc,yr=(Wx[2]*cp-(VP.cy-p[1])/VP.sc)/sp,cy=Math.cos(yaw),sy=Math.sin(yaw);
    a=xr*cy+yr*sy;b=-xr*sy+yr*cy;
  }
  return [Math.max(-E,Math.min(E,a)),Math.max(-E,Math.min(E,b))];
}
cv.addEventListener('pointerdown',function(e){
  var p=local(e);if(!inV(p))return;
  down={p:p,last:p,moved:0,tip:onTip(p)};cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',function(e){
  var p=local(e);
  if(!down){cv.style.cursor=onTip(p)?'move':(inV(p)?(dim===3?'grab':'pointer'):'default');return;}
  down.moved+=Math.abs(p[0]-down.last[0])+Math.abs(p[1]-down.last[1]);
  if(down.tip){var q=unproject(p);if(q){moveTo(q[0],q[1]);$('sig').value='moved';draw();}}
  else if(dim===3){yaw-=(p[0]-down.last[0])*0.01;pitch=Math.max(-1.5,Math.min(1.5,pitch+(p[1]-down.last[1])*0.01));draw();}
  down.last=p;
});
function up(){
  if(down&&!down.tip&&down.moved<5){
    var best=-1,bd=14;dots.forEach(function(q){var d=Math.hypot(q.X-down.p[0],q.Y-down.p[1]);if(d<bd){bd=d;best=q.i;}});
    if(best>=0){setCur(best);var has=OPTIONS.some(function(o){return o.idx===best;});$('sig').value=has?best:'picked';draw();}
  }
  down=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(){down=null;});
window.addEventListener('resize',resize);
resize();
</script>
</body>
